name: Go tests

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:

concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Build
        run: go build -o rodney${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
      - name: Check version flag
        run: ./rodney${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
